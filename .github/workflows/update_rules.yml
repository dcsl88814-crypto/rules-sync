name: Update sing-box Rules

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set repo vars
        run: |
          echo "OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install requests urllib3

      - name: Install sing-box (for .srs compilation)
        run: |
          VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo cp "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/
          sing-box version

      - name: Run update script
        id: update
        run: python update_rules.py 2>&1 | tee update.log

      - name: Extract stats
        id: stats
        if: success()
        run: |
          STATS=$(grep -oP 'Done\. \K.*' update.log || echo "rules updated")
          echo "summary=${STATS}" >> "$GITHUB_OUTPUT"

      - name: Commit & push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain rules/)" ]; then
            git add rules/
            git commit -m "chore: auto-update modules — $(date -u +'%Y-%m-%d')" -m "${{ steps.stats.outputs.summary }}"
            git push
          else
            echo "No changes to commit"
          fi
