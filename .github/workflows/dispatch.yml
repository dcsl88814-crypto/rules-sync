name: Daily Dispatch

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger module branch update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-module.yml/dispatches \
            -d '{"ref":"module"}'
      - name: Trigger srs branch update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-srs.yml/dispatches \
            -d '{"ref":"srs"}'
