name: Update domain-list Rule Sets

# 把 Loyalsoldier/domain-list-custom 的名单编译成 sing-box 规则集
# （domainlist/<name>.json + .srs），并直接提交回 `srs` 分支。
#
# 为什么放在默认分支（main）：
#   GitHub 只从默认分支运行 `schedule` 工作流，且 workflow_dispatch 只能
#   触发已被索引（默认分支上存在）的工作流。所以工作流放 main，
#   通过 checkout ref: srs 拿到脚本、把产物 push 回 srs。

on:
  schedule:
    # 23:40 UTC = 北京时间 07:40，等上游构建完成之后
    - cron: '40 23 * * *'
  workflow_dispatch:

concurrency:
  group: domainlist-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout srs branch
        uses: actions/checkout@v4
        with:
          ref: srs
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install requests urllib3

      - name: Install sing-box (for .srs compilation)
        run: |
          VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo cp "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/
          sing-box version

      - name: Build rule sets
        run: python update_domainlist.py 2>&1 | tee domainlist.log

      - name: Commit & push to srs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain domainlist/)" ]; then
            git add domainlist/
            git commit -m "chore(domainlist): auto-update — $(date -u +'%Y-%m-%d')" \
              -m "$(grep -oP 'Done\. \K.*' domainlist.log || echo 'rule sets updated')"
            git push origin HEAD:srs
          else
            echo "No changes to commit"
          fi
