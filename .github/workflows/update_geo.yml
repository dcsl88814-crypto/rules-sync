name: Update Geo Rule Sets (geosite/geoip → srs)

# Loyalsoldier 只发布 v2ray 格式的 geosite.dat / geoip.dat（sing-box 读不了），
# 这个工作流把它们转成 sing-box 的 .srs，直接提交回 srs 分支。
#
# 产物布局（与 {tag} 模板对齐，只改 URL 前缀即可）：
#   geo/geosite/<category>.srs
#   geo/geoip/<country>.srs
#
# 放在默认分支(main)上是因为：GitHub 只从默认分支运行 schedule 工作流，
# 且 workflow_dispatch 只能触发已索引的工作流。

on:
  schedule:
    # 23:20 UTC = 北京时间 07:20，等上游（约 06:00 CST 发布）之后
    - cron: '20 23 * * *'
  workflow_dispatch:

concurrency:
  group: geo-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout srs branch
        uses: actions/checkout@v4
        with:
          ref: srs
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install sing-box (for .srs compilation)
        run: |
          VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo cp "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/
          sing-box version

      - name: Convert geosite/geoip to rule sets
        run: |
          mkdir -p .build && cd .build
          python3 ../loyalsoldier-srs.py --out out 2>&1 | tee convert.log
          cd ..
          rm -rf geo
          mkdir -p geo
          mv .build/out/geo/* geo/
          cp .build/convert.log geo/convert.log
          echo "geosite: $(ls geo/geosite/*.srs | wc -l) files"
          echo "geoip:   $(ls geo/geoip/*.srs | wc -l) files"
          du -sh geo

      - name: Commit & push to srs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 旧布局 loyalsoldier/ 已在 2026-10-16 的迁移中从 srs 删除。
          # 不要再用 "git status --porcelain geo loyalsoldier"：路径不存在时 git
          # 以 128 退出（fatal: pathspec 'loyalsoldier' did not match any files），
          # 这正是 2026-10-17 起定时任务一直失败的原因。
          # 只在它仍被跟踪时才清理，路径不存在是正常情况。
          git rm -rq --ignore-unmatch loyalsoldier
          git add -A geo
          if ! git diff --cached --quiet; then
            git commit -m "chore(geo): update geosite/geoip rule sets — $(date -u +'%Y-%m-%d')" \
              -m "$(tail -3 geo/convert.log | tr '\n' ' ')"
            git push origin HEAD:srs
          else
            echo "No changes to commit"
          fi
